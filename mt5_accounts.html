<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SignalX · MT5 Accounts</title>
<style>
body{margin:0;background:#050912;color:#eaf4ff;font-family:Inter,Arial,sans-serif}.wrap{max-width:1120px;margin:auto;padding:20px}.card{background:linear-gradient(145deg,#0b1424,#08101b);border:1px solid #19365b;border-radius:16px;padding:15px;margin:10px 0;box-shadow:0 0 24px #00152b66}h1{margin:0 0 4px;color:#69c8ff}.muted{color:#8da7bd}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}input,button{width:100%;box-sizing:border-box;padding:10px;border-radius:9px;border:1px solid #24496e;background:#07101b;color:#fff}button{cursor:pointer;background:#0d4164;border-color:#2a8bc2;font-weight:700;margin-top:6px}.danger{background:#491b25;border-color:#9b3447}.account-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:10px}.account{padding:14px;border-radius:14px;border:1px solid #19365b;background:linear-gradient(145deg,#0b1424,#08101b)}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.type{font-size:10px;font-weight:900;padding:4px 7px;border-radius:999px;border:1px solid #24496e}.real{color:#ff8b9a;border-color:#9b3447}.demo{color:#75d2ff}.status{font-size:11px;font-weight:900}.status.on{color:#63ef9b}.status.off{color:#ff6f7f}.meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:11px;color:#8da7bd}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}.metric{padding:8px;border:1px solid #173553;border-radius:9px;background:#07101b}.metric small{display:block;color:#7891a7;font-size:9px}.metric b{display:block;margin-top:3px;font-size:12px}.auto{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:9px;padding:9px;border:1px solid #24496e;border-radius:9px}.auto.on{border-color:#3a8b68}.auto button{width:auto;min-width:130px;margin:0}.actions{display:flex;justify-content:flex-end;gap:6px;margin-top:6px}.actions button{width:auto;margin:0}.lot-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;padding:8px;border:1px solid #24496e;border-radius:9px;background:#07101b}.lot-controls{display:flex;gap:6px;align-items:center}.lot-select{min-width:90px;padding:8px;border-radius:8px;border:1px solid #24496e;background:#07101b;color:#fff}.lot-save{width:auto;margin:0;padding:8px 10px}.mini{font-size:10px;color:#8da7bd}@media(max-width:650px){.wrap{padding:12px}.account-grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.auto{align-items:stretch;flex-direction:column}.auto button{width:100%}}</style></head>
<body><div class="wrap">
<h1>MT5 Account Gateway</h1><div class="muted">Demo va Real hisoblarni brokerdan mustaqil ulash</div>

<div class="card"><h2>Yangi MT5 hisob ulash</h2>
<div class="grid"><div><label>Account nomi</label><input id="label" value="My MT5 Account"></div></div>
<button onclick="pair()">PAIRING CODE OLISH</button>
<div id="pairout" class="muted"></div>
<p class="muted">Keyin <b>SignalX_MultiBroker_Gateway_EA.mq5</b> ni MT5 ga o‘rnating, PairingCode maydoniga kodni kiriting va EA ni ishga tushiring.</p>
</div>

<div class="card"><h2>Ulangan hisoblar</h2><div id="accounts">Yuklanmoqda...</div></div>
</div>
<script>
const token=localStorage.getItem('signalx_token')||localStorage.getItem('token')||'';
const H={'Authorization':'Bearer '+token,'Content-Type':'application/json'};
async function api(path,opt={}){const r=await fetch('/api/v1/mt5/gateway'+path,{...opt,headers:{...H,...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||'Xatolik');return d}
async function pair(){try{const d=await api('/pair',{method:'POST',body:JSON.stringify({label:document.getElementById('label').value})});document.getElementById('pairout').innerHTML='<b>PAIRING CODE: '+d.pairing_code+'</b><br>Kod '+d.expires_in+' soniya amal qiladi.'}catch(e){document.getElementById('pairout').textContent=e.message}}
async function toggle(id,en){try{await api('/accounts/'+id+'/auto-trade',{method:'POST',body:JSON.stringify({enabled:en})});load()}catch(e){alert(e.message)}}
async function togglePending(id,en){try{await api('/accounts/'+id+'/pending-trade',{method:'POST',body:JSON.stringify({enabled:en})});load()}catch(e){alert(e.message)}}
async function saveLot(id){const el=document.querySelector(`[data-lot="${id}"]`);try{const lot=Number(el?.value||0.01);await api('/accounts/'+id+'/lot',{method:'POST',body:JSON.stringify({lot}));load()}catch(e){alert(e.message)}}
async function disconnect(id){if(!confirm('Bu MT5 hisobni UZASIZMI? AutoTrade OFF qilinadi va EA tokeni bekor qilinadi. Qayta ulash uchun yangi pairing kerak bo‘ladi.'))return;try{await api('/accounts/'+id+'/disconnect',{method:'POST'});load()}catch(e){alert(e.message)}}
async function deleteAccount(id){if(!confirm('DIQQAT: bu hisob va uning saqlangan signal/order ma’lumotlari o‘chiriladi. Davom etasizmi?'))return;try{await api('/accounts/'+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}
async function load(){try{const d=await api('/accounts');document.getElementById('accounts').innerHTML=d.items.length?'<div class="account-grid">'+d.items.map(a=>{const online=!!a.connected;const type=(a.account_type||'demo').toUpperCase();const autoOn=!!a.auto_trade_enabled;const canOn=online&&!!a.trade_allowed;const status=online?'ONLINE':'OFFLINE';const reason=!online?'MT5 terminal / EA offline':(!a.trade_allowed?'MT5 trading permission OFF':'');return `<div class="account"><div class="top"><div><span class="type ${type==='REAL'?'real':'demo'}">${type}</span> <b>${a.broker||'Broker'}</b><div class="mini">${a.label||'MT5 Account'}</div></div><div class="status ${online?'on':'off'}">● ${status}</div></div><div class="meta"><span>Login: <b>${a.login||'—'}</b></span><span>Server: <b>${a.server||'—'}</b></span></div><div class="metrics"><div class="metric"><small>Balance</small><b>${Number(a.balance||0).toFixed(2)} ${a.currency||''}</b></div><div class="metric"><small>Equity</small><b>${Number(a.equity||0).toFixed(2)} ${a.currency||''}</b></div><div class="metric"><small>Free Margin</small><b>${Number(a.free_margin||0).toFixed(2)} ${a.currency||''}</b></div><div class="metric"><small>Leverage</small><b>1:${a.leverage||0}</b></div></div><div class="meta"><span>Trade Allowed: <b>${a.trade_allowed?'YES':'NO'}</b></span><span>EA: <b>${a.ea_version||'—'}</b></span><span>Heartbeat: <b>${a.last_seen_seconds==null?'—':a.last_seen_seconds+'s'}</b></span></div><div class="lot-row"><div><b>LOT SIZE</b><div class="mini">Faqat shu ${type} account</div></div><div class="lot-controls"><select class="lot-select" data-lot="${a.id}">${[0.01,0.02,0.05,0.1,0.2,0.5,1,2,5].map(v=>`<option value="${v}" ${Math.abs(Number(a.lot||0.01)-v)<1e-9?'selected':''}>${v.toFixed(2)}</option>`).join('')}</select><button class="lot-save" onclick="saveLot(${a.id})">SAQLASH</button></div></div><div class="auto ${autoOn?'on':''}"><div><b>AutoTrade: ${autoOn?'ON':'OFF'}</b><div class="mini">Faqat shu ${type} account uchun.${reason?' '+reason:''}</div></div><button ${(!autoOn&&!canOn)?'disabled':''} onclick="toggle(${a.id},${!autoOn})">${autoOn?'AUTO TRADE OFF':'AUTO TRADE ON'}</button></div><div class="auto ${a.pending_trade_enabled!==false?'on':''}"><div><b>Auto Pending: ${a.pending_trade_enabled!==false?'ON':'OFF'}</b><div class="mini">STOP/LIMIT orderlari faqat shu ${type} account uchun.</div></div><button ${((a.pending_trade_enabled===false)&&!online)?'disabled':''} onclick="togglePending(${a.id},${a.pending_trade_enabled===false})">${a.pending_trade_enabled===false?'AUTO PENDING ON':'AUTO PENDING OFF'}</button></div><div class="actions"><button class="danger" onclick="disconnect(${a.id})">DISCONNECT</button><button class="danger" onclick="deleteAccount(${a.id})">O‘CHIRISH</button></div></div>`}).join('')+'</div>':'Hali MT5 hisob ulanmagan.'}catch(e){document.getElementById('accounts').textContent=e.message}}load();setInterval(load,10000);
</script></body></html>
